name: perms probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "== intento EXACTO de release v1.1.0 =="
          gh api -X POST /repos/${{ github.repository }}/releases \
            -f tag_name=v1.1.0 \
            -f target_commitish=1a2a5b07be465ae8ef18f9cda03dcba26d033766 \
            -f name="Galaga1981 v1.1.0" \
            -F generate_release_notes=true 2>&1 | head -c 500
          echo ""
          echo "== releases actuales =="
          gh api /repos/${{ github.repository }}/releases --jq '.[]|{tag_name,id}' | head -5
