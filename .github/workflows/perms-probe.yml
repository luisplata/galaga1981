name: perms probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          R=/repos/${{ github.repository }}/releases
          OLD=1a2a5b07be465ae8ef18f9cda03dcba26d033766
          echo "F: commit viejo + generate_notes"
          gh api -X POST $R -f tag_name=v1.2.2 -f name="probe F" -f target_commitish=$OLD -F generate_release_notes=true 2>&1 | head -c 220; echo
          echo "G: commit viejo SIN notes"
          gh api -X POST $R -f tag_name=v1.2.3 -f name="probe G" -f target_commitish=$OLD 2>&1 | head -c 220; echo
