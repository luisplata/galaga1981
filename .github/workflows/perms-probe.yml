name: perms probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          R=/repos/${{ github.repository }}/releases
          SHA=$(gh api /repos/${{ github.repository }}/commits/main --jq .sha)
          echo "HEAD=$SHA"
          echo "D: commitish + generate_notes"
          gh api -X POST $R -f tag_name=v1.2.0 -f name="probe D" -f target_commitish=$SHA -F generate_release_notes=true 2>&1 | head -c 220; echo
          echo "E: solo generate_notes"
          gh api -X POST $R -f tag_name=v1.2.1 -f name="probe E" -F generate_release_notes=true 2>&1 | head -c 220; echo
          echo "== releases =="
          gh api $R --jq '.[]|.tag_name'
