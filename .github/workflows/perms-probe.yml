name: perms probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          R=/repos/${{ github.repository }}/releases
          echo "A: v1.1.0 minimo"
          gh api -X POST $R -f tag_name=v1.1.0 -f name="probe A" 2>&1 | head -c 300; echo
          echo "B: v1.1.1 minimo"
          gh api -X POST $R -f tag_name=v1.1.1 -f name="probe B" 2>&1 | head -c 300; echo
          echo "C: v9.9.9 con generate_release_notes"
          gh api -X POST $R -f tag_name=v9.9.9 -f name="probe C" -F generate_release_notes=true 2>&1 | head -c 300; echo
          echo "== releases =="
          gh api $R --jq '.[]|.tag_name'
