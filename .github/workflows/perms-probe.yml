name: perms probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OLD=1a2a5b07be465ae8ef18f9cda03dcba26d033766
          echo "H: crear tag en commit viejo"
          gh api -X POST /repos/${{ github.repository }}/git/refs -f ref=refs/tags/probe-old -f sha=$OLD 2>&1 | head -c 220; echo
          echo "I: crear release SIN target_commitish sobre tag existente"
          gh api -X POST /repos/${{ github.repository }}/releases -f tag_name=probe-old -f name="probe I" -F generate_release_notes=true 2>&1 | head -c 220; echo
          echo "J: limpieza"
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/probe-old 2>&1 | head -c 120; echo
