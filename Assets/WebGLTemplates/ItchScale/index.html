<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
        }
        #game-container {
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #unity-canvas {
            background: #000;
        }
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="loading">Cargando...</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var loading = document.querySelector("#loading");

        var config = {
            dataUrl: "Build/{{{ DATA_FILENAME }}}",
            frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: "Build/{{{ CODE_FILENAME }}}",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };

        // Escala el canvas para que CABE ENTERO en el contenedor (letterbox,
        // respetando la proporción vertical 9:16) — ideal para iframes de Itch.
        var GAME_W = 1080;
        var GAME_H = 1920;

        function resize() {
            var cw = canvas.width || GAME_W;
            var ch = canvas.height || GAME_H;
            var scale = Math.min(window.innerWidth / cw, window.innerHeight / ch);
            canvas.style.width = (cw * scale) + "px";
            canvas.style.height = (ch * scale) + "px";
        }

        window.addEventListener("resize", resize);
        window.addEventListener("orientationchange", resize);

        createUnityInstance(canvas, config)
            .then(function (instance) {
                loading.style.display = "none";
                resize();
            })
            .catch(function (message) {
                loading.textContent = "Error al cargar el juego: " + message;
            });
    </script>
</body>
</html>
